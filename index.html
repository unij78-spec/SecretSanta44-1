<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4b0a07">
  <title>Գաղտնի Սանտա</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+Armenian:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Рисунки, которые используются в нескольких местах -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <!-- Еловая веточка с ягодами -->
    <symbol id="sprig" viewBox="0 0 200 64">
      <g stroke="var(--needle, #2f5a3a)" stroke-width="3.2" stroke-linecap="round" fill="none">
        <path d="M14 32L23 17M14 32L23 47 M25 32L34 17M25 32L34 47 M36 32L45 17M36 32L45 47 M47 32L56 17M47 32L56 47
                 M58 32L67 17M58 32L67 47 M69 32L78 17M69 32L78 47 M80 32L89 17M80 32L89 47 M91 32L100 17M91 32L100 47
                 M102 32L111 17M102 32L111 47 M113 32L122 17M113 32L122 47 M124 32L133 17M124 32L133 47 M135 32L144 17M135 32L144 47
                 M146 32L155 17M146 32L155 47 M157 32L166 17M157 32L166 47 M168 32L177 17M168 32L177 47 M179 32L188 17M179 32L188 47"/>
      </g>
      <path d="M4 32H196" stroke="#5a3b22" stroke-width="3" stroke-linecap="round"/>
      <g fill="#b3182d">
        <circle cx="52" cy="32" r="4.6"/><circle cx="57" cy="32" r="4.6"/>
        <circle cx="98" cy="35" r="4.6"/><circle cx="103" cy="35" r="4.6"/>
        <circle cx="146" cy="31" r="4.6"/><circle cx="151" cy="31" r="4.6"/>
      </g>
      <g fill="#ee7a8a">
        <circle cx="50.6" cy="30.5" r="1.2"/><circle cx="55.6" cy="30.5" r="1.2"/>
        <circle cx="96.6" cy="33.5" r="1.2"/><circle cx="101.6" cy="33.5" r="1.2"/>
        <circle cx="144.6" cy="29.5" r="1.2"/><circle cx="149.6" cy="29.5" r="1.2"/>
      </g>
    </symbol>

    <!-- Красный бант (экран розыгрыша) -->
    <symbol id="bow" viewBox="0 0 120 84">
      <path d="M60 40C30 4 4 10 8 40C11 64 42 58 60 40Z" fill="#c21c35"/>
      <path d="M60 40C90 4 116 10 112 40C109 64 78 58 60 40Z" fill="#c21c35"/>
      <path d="M56 46L36 80L52 73L61 82L64 48Z" fill="#8f1224"/>
      <path d="M64 46L84 80L68 73L59 82Z" fill="#a8172c"/>
      <path d="M16 36C24 22 38 24 50 38M104 36C96 22 82 24 70 38" stroke="#ee6b80" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="49" y="29" width="22" height="22" rx="7" fill="#d9304a"/>
    </symbol>

    <!-- Бант-контур (страница участника) -->
    <symbol id="bow-line" viewBox="0 0 80 48">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 22C30 6 8 2 6 16C4 30 28 30 40 22Z"/>
        <path d="M40 22C50 6 72 2 74 16C76 30 52 30 40 22Z"/>
        <path d="M37 22L28 44M43 22L52 44"/>
      </g>
      <circle cx="40" cy="22" r="4" fill="currentColor"/>
    </symbol>

    <!-- Рваный край -->
    <symbol id="tear" viewBox="0 0 400 14" preserveAspectRatio="none">
      <path d="M0 14V7L14 4L30 8L52 3L70 7L95 2L118 7L140 4L165 8L190 3L212 7L240 2L262 6L288 3L310 8L335 4L360 7L380 3L400 6V14Z"/>
    </symbol>
  </svg>

  <!-- Шапка главной страницы (на странице участника скрывается в style.css) -->
  <header class="hero">
    <ul class="lights" aria-hidden="true">
      <li></li><li></li><li></li><li></li><li></li><li></li><li></li>
      <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>
    <svg class="corner l" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="corner r" aria-hidden="true"><use href="#sprig"/></svg>
    <h1 class="script">Secret Santa</h1>
    <p class="star">✦</p>
    <svg class="tear" aria-hidden="true"><use href="#tear"/></svg>
  </header>

  <main>

    <!-- Экран 1: выбор имени и ввод кода -->
    <section id="gate" class="sheet">
      <div class="frame">
        <div class="inner">
          <p class="lead">Ընտրեք ձեր անունը, մուտքագրեք կոդը և իմացեք, ում համար եք նվեր պատրաստելու։</p>

          <label for="name">Ձեր անունը</label>
          <select id="name"><option value="">Ընտրեք անունը</option></select>

          <label for="code">Մուտքի կոդ</label>
          <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="••••">

          <p id="err" class="err" role="alert"></p>
          <button id="go">Քաշել անուն</button>
        </div>
      </div>
      <svg class="foot" aria-hidden="true"><use href="#sprig"/></svg>
    </section>

    <!-- Экран 2: анимация розыгрыша -->
    <section id="draw" hidden>
      <svg class="bow" aria-hidden="true"><use href="#bow"/></svg>
      <p class="small">Խառնում ենք անունները…</p>
      <div id="roll" class="roll">&nbsp;</div>
    </section>

    <!-- Экран 3: карточка выбранного человека. Фон — bg.jpg -->
    <section id="result" hidden>
      <div class="letter">

        <!-- Мерцающие звёзды -->
        <div class="sky" aria-hidden="true">
          <i style="left: 6%;  top: 9%;  --size: 14px; --delay: 0s;"></i>
          <i style="right: 7%; top: 16%; --size: 11px; --delay: 1.1s;"></i>
          <i style="left: 4%;  top: 38%; --size: 10px; --delay: 2.2s;"></i>
          <i style="right: 5%; top: 52%; --size: 15px; --delay: 0.6s;"></i>
          <i style="left: 52%; bottom: 34%; --size: 12px; --delay: 1.7s;"></i>
          <i style="right: 14%; bottom: 27%; --size: 16px; --delay: 0.3s;"></i>
          <i style="left: 40%; bottom: 40%; --size: 9px; --delay: 2.6s;"></i>
        </div>

        <div class="letter-body">
          <h1 class="script title">Secret Santa</h1>

          <div class="ornament" aria-hidden="true">
            <svg><use href="#bow-line"/></svg>
          </div>

          <h2 id="who" class="name"></h2>

          <dl id="info"></dl>
        </div>
      </div>

      <div class="sheet">
        <p class="note">Արդյունքը պահպանված է այս սարքում։ Բացեք նորից՝ կտեսնեք նույն անկետան։</p>
        <svg class="foot" aria-hidden="true"><use href="#sprig"/></svg>
      </div>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="snow.js"></script>
</body>
</html>
